*{

padding:0;

html{

}

PARTICLES
======================*/

position:fixed;

inset:0;

pointer-events:none;

z-index:-5;

}

/*======================
NAVBAR
======================*/
  
header{
position:fixed;
top:0;
left:0;
width:100%;
background:rgba(255,255,255,.88);
backdrop-filter:blur(18px);

}

user-select:none;

width:46px;
height:46px;

nav ul{

nav ul li{

}

nav ul li a{

text-decoration:none;

}

nav ul li a::after{
content:"";
position:absolute;
left:0;
bottom:-5px;
width:0%;
height:3px;
border-radius:50px;
background:linear-gradient(90deg,var(--gold),var(--gold-dark));
transition:.35s;
}

nav ul li a:hover{
color:var(--gold-dark);
}

nav ul li a:hover::after{
width:100%;
}

HERO
======================*/

min-height:470px;

display:flex;

justify-content:center;

align-items:center;

padding:130px 20px 90px;

text-align:center;

}

.hero::before{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(rgba(255,255,255,.93),rgba(255,255,255,.95)),

url("logo.png") center center/370px no-repeat;

opacity:.10;

}

transform:translateY(0) scale(1);

}

}

z-index:2;

font-weight:800;

color:var(--gold-dark);

.hero p{

font-size:1.18rem;

color:#555;

<section id="preamble" class="reveal">

<div class="container">

<h2 class="title">

Preamble

</h2>

<div class="article">

<p>

We, the members of the <strong>Antique Janta Party (AJP)</strong>, united by our commitment to constitutional democracy, informed political discussion, civic responsibility and respectful public dialogue, hereby adopt this Constitution as the supreme governing document of our organisation.

</p>

<br>

<p>

AJP exists to encourage independent political thought, evidence-based discussion, constitutional awareness and responsible democratic participation while rejecting misinformation, hatred and unquestioning political allegiance.

</p>

<br>

<p>

Through this Constitution, we affirm our dedication to justice, liberty, equality, accountability, transparency and national progress while upholding the spirit and values of the Constitution of India.

</p>

</div>

<section id="articles" class="reveal">

<div class="container">

<h2 class="title">

Constitution

</h2>
<!-- ARTICLE I -->

<div class="article">

<h2>ARTICLE I</h2>

<h3>Name, Identity & Nature</h3>

<p>

The official name of this organisation shall be the <strong>Antique Janta Party (AJP)</strong>. It shall function as an independent political discussion and civic awareness organisation dedicated to promoting constitutional values, democratic participation and informed public discourse.

</p>

<h3>Motto</h3>

<p>

<strong>"कलम हमारी • आवाज आपकी"</strong>

</p>

<h3>Official Colours</h3>

<ul>

<li>Antique Gold</li>

<li>White</li>

<li>Black</li>

</ul>

<h3>Official Language</h3>

<p>

English shall be the principal working language of the Party. Hindi and other Indian languages may be used whenever appropriate.

</p>

</div>

<!-- ARTICLE II -->

<div class="article">

<h2>ARTICLE II</h2>

<h3>Vision</h3>

<p>

To establish India's most respected constitutional political discussion community where every individual can express opinions freely, responsibly and respectfully while encouraging independent thought and civic awareness.

</p>

<h3>Mission</h3>

<ul>

<li>Promote constitutional literacy.</li>

<li>Encourage evidence-based political discussion.</li>

<li>Develop informed citizens.</li>

<li>Protect democratic values.</li>

<li>Maintain respectful public debate.</li>

<li>Encourage leadership through merit.</li>

</ul>

</div>

<!-- ARTICLE III -->

<div class="article">

<h2>ARTICLE III</h2>

<h3>Fundamental Principles</h3>

<p>

Every activity of AJP shall be governed by the following constitutional principles.

</p>

<ul>

<li>Respect for the Constitution of India.</li>

<li>Freedom of expression with responsibility.</li>

<li>Equality before discussion.</li>

<li>Truth over propaganda.</li>

<li>Evidence over misinformation.</li>

<li>Critical thinking over blind political support.</li>

<li>Respect for differing opinions.</li>

<li>Transparency and accountability.</li>

<li>Democratic governance.</li>

<li>National unity above political division.</li>

</ul>

</div>

<!-- ARTICLE IV -->

<div class="article">

<h2>ARTICLE IV</h2>

<h3>Objectives</h3>

<p>

The objectives of the Antique Janta Party shall include—

</p>

<ul>

<li>Promote informed political discussion.</li>

<li>Increase constitutional awareness among citizens.</li>

<li>Encourage respectful debate.</li>

<li>Develop responsible future leaders.</li>

<li>Reject misinformation and propaganda.</li>

<li>Protect freedom of thought.</li>

<li>Strengthen democratic participation.</li>

<li>Provide a disciplined and impartial political discussion platform.</li>

<li>Promote civic responsibility.</li>

<li>Encourage constructive criticism of governments and political parties based upon evidence.</li>

</ul>

</div>

<!-- ARTICLE V -->

<div class="article">

<h2>ARTICLE V</h2>

<h3>Membership</h3>

<p>

Membership of AJP shall remain voluntary and open to every individual who accepts this Constitution and agrees to uphold its values.

</p>

<h3>Eligibility</h3>

<ul>

<li>Acceptance of this Constitution.</li>

<li>Respect for democratic principles.</li>

<li>Respectful behaviour.</li>

<li>No history of severe misconduct within AJP.</li>

</ul>

<h3>Rights</h3>

<ul>

<li>Participate in discussions.</li>

<li>Present constructive criticism.</li>

<li>Vote whenever eligible.</li>

<li>Apply for organisational responsibilities.</li>

<li>Appeal disciplinary decisions.</li>

</ul>

<h3>Duties</h3>

<ul>

<li>Protect the dignity of AJP.</li>

<li>Maintain respectful conduct.</li>

<li>Promote constitutional values.</li>

<li>Respect organisational decisions.</li>

<li>Encourage informed discussion.</li>

</ul>

</div>

<!-- ARTICLE VI -->

<div class="article">

<h2>ARTICLE VI</h2>

<h3>Constitutional Leadership</h3>

<p>

The constitutional leadership of AJP shall consist of the following offices.

</p>

<ol>

<li>President</li>

<li>Vice-President</li>

<li>Executive Director</li>

<li>Deputy Chairperson</li>

<li>Secretary-General</li>

<li>Chief Whip</li>

<li>Media Head</li>

<li><strong>Director of Administration</strong></li>

</ol>

<p>

The President, Vice-President and Executive Director shall together constitute the <strong>Constitutional Council</strong>, which shall exercise the highest constitutional authority within the organisation.

</p>

</div>
<!-- ARTICLE VII -->

<div class="article">

<h2>ARTICLE VII</h2>

<h3>The President</h3>

<p>

The President shall be the supreme constitutional authority and Head of the Antique Janta Party. The President shall safeguard the vision, values and long-term direction of the organisation.

</p>

<h3>Powers & Responsibilities</h3>

<ul>

<li>Preside over the Constitutional Council.</li>

<li>Protect and uphold this Constitution.</li>

<li>Represent AJP before the public.</li>

<li>Approve constitutional amendments after ratification.</li>

<li>Guide the long-term vision of the organisation.</li>

<li>Exercise constitutional authority jointly with the Vice-President and Executive Director.</li>

</ul>

<h3>Tenure</h3>

<p>

The office of the President is a permanent constitutional office and shall not be subject to removal through ordinary organisational procedures.

</p>

</div>

<!-- ARTICLE VIII -->

<div class="article">

<h2>ARTICLE VIII</h2>

<h3>The Vice-President</h3>

<p>

The Vice-President shall serve as the second-highest constitutional authority and principal advisor to the President.

</p>

<h3>Powers & Responsibilities</h3>

<ul>

<li>Assist the President in constitutional governance.</li>

<li>Exercise constitutional authority jointly with the President.</li>

<li>Perform presidential responsibilities during temporary absence.</li>

<li>Participate in all Constitutional Council decisions.</li>

<li>Support organisational stability and continuity.</li>

</ul>

<h3>Tenure</h3>

<p>

The office of the Vice-President shall remain a permanent constitutional office and shall not be removed through ordinary organisational procedures.

</p>

</div>

<!-- ARTICLE IX -->

<div class="article">

<h2>ARTICLE IX</h2>

<h3>The Executive Director</h3>

<p>

The Executive Director shall be the chief executive officer responsible for implementing the policies, programmes and strategic decisions of the Antique Janta Party.

</p>

<h3>Election</h3>

<ul>

<li>The Executive Director shall be elected through an official voting process.</li>

<li>Only eligible members may participate according to electoral rules prescribed by the Constitutional Council.</li>

<li>The candidate receiving the required majority shall assume office.</li>

</ul>

<h3>Powers & Responsibilities</h3>

<ul>

<li>Lead the Executive Leadership.</li>

<li>Implement constitutional policies.</li>

<li>Coordinate all organisational departments.</li>

<li>Recommend appointments to leadership positions.</li>

<li>Supervise day-to-day functioning of AJP.</li>

</ul>

</div>

<!-- ARTICLE X -->

<div class="article">

<h2>ARTICLE X</h2>

<h3>Constitutional Council</h3>

<p>

The Constitutional Council shall be the highest governing authority of the Antique Janta Party.

</p>

<h3>Composition</h3>

<ol>

<li>President</li>

<li>Vice-President</li>

<li>Executive Director</li>

</ol>

<h3>Authority</h3>

<ul>

<li>Interpret this Constitution.</li>

<li>Approve constitutional appointments.</li>

<li>Protect organisational integrity.</li>

<li>Ratify major constitutional decisions.</li>

<li>Approve constitutional amendments.</li>

<li>Exercise final executive authority.</li>

</ul>

</div>

<!-- ARTICLE XI -->

<div class="article">

<h2>ARTICLE XI</h2>

<h3>Appointment & Removal of Executive Leadership</h3>

<p>

The Constitutional Council shall possess the exclusive authority to appoint and remove members of the Executive Leadership.

</p>

<h3>Appointment</h3>

<p>

Appointments to the offices of Deputy Chairperson, Secretary-General, Chief Whip, Media Head and Director of Administration shall be made jointly by the President, Vice-President and Executive Director.

</p>

<h3>Removal</h3>

<p>

Any holder of an Executive Leadership office may be removed only through the approval of not less than a <strong>two-thirds (2/3) majority</strong> of the Constitutional Council.

</p>

<p>

No Executive Leader shall be removed without being informed of the grounds and being given a reasonable opportunity to present an explanation, except in cases involving immediate threats to the organisation.

</p>

</div>

<!-- ARTICLE XII -->

<div class="article">

<h2>ARTICLE XII</h2>

<h3>Executive Leadership</h3>

<p>

The Executive Leadership shall administer the daily affairs of the Party under the direction of the Constitutional Council.

</p>

<h3>Executive Offices</h3>

<ul>

<li>Deputy Chairperson</li>

<li>Secretary-General</li>

<li>Chief Whip</li>

<li>Media Head</li>

<li>Director of Administration</li>

</ul>

<p>

Additional executive offices may be created by resolution of the Constitutional Council whenever necessary for the efficient administration of AJP.

</p>

</div>
<!-- ARTICLE XIII -->

<div class="article">

<h2>ARTICLE XIII</h2>

<h3>Deputy Chairperson</h3>

<p>

The Deputy Chairperson shall serve as the senior executive officer responsible for assisting the Constitutional Council in implementing organisational decisions and ensuring smooth coordination between departments.

</p>

<h3>Powers & Responsibilities</h3>

<ul>

<li>Assist the Constitutional Council in executive administration.</li>

<li>Coordinate inter-departmental operations.</li>

<li>Monitor organisational progress.</li>

<li>Chair meetings when authorised.</li>

<li>Perform duties assigned by the Constitutional Council.</li>

</ul>

</div>

<!-- ARTICLE XIV -->

<div class="article">

<h2>ARTICLE XIV</h2>

<h3>Secretary-General</h3>

<p>

The Secretary-General shall be the chief administrative officer responsible for maintaining official records and constitutional documentation.

</p>

<ul>

<li>Maintain official records.</li>

<li>Prepare meeting agendas and minutes.</li>

<li>Issue official circulars and notices.</li>

<li>Maintain constitutional documents.</li>

<li>Manage internal communications.</li>

</ul>

</div>

<!-- ARTICLE XV -->

<div class="article">

<h2>ARTICLE XV</h2>

<h3>Chief Whip</h3>

<p>

The Chief Whip shall maintain organisational discipline and ensure adherence to this Constitution.

</p>

<ul>

<li>Promote discipline.</li>

<li>Ensure compliance with Party rules.</li>

<li>Resolve internal disputes fairly.</li>

<li>Recommend disciplinary action where necessary.</li>

<li>Maintain order during meetings.</li>

</ul>

</div>

<!-- ARTICLE XVI -->

<div class="article">

<h2>ARTICLE XVI</h2>

<h3>Media Head</h3>

<p>

The Media Head shall oversee all official publications and public communication of the Antique Janta Party.

</p>

<ul>

<li>Manage official announcements.</li>

<li>Maintain social media platforms.</li>

<li>Protect the public image of AJP.</li>

<li>Verify official information before publication.</li>

<li>Coordinate media campaigns approved by leadership.</li>

</ul>

</div>

<!-- ARTICLE XVII -->

<div class="article">

<h2>ARTICLE XVII</h2>

<h3>Director of Administration</h3>

<p>

The Director of Administration shall supervise the administration of all official Party platforms, systems and operational infrastructure.

</p>

<ul>

<li>Supervise administrators.</li>

<li>Maintain organisational security.</li>

<li>Ensure smooth platform operations.</li>

<li>Protect official resources.</li>

<li>Implement administrative policies.</li>

</ul>

</div>

<!-- ARTICLE XVIII -->

<div class="article">

<h2>ARTICLE XVIII</h2>

<h3>Meetings</h3>

<h3>Regular Meetings</h3>

<p>

Regular meetings shall be held at intervals or on some periods determined by the Constitutional Council to review organisational affairs and future initiatives.

</p>

<h3>Emergency Meetings</h3>

<p>

The President, Vice-President or Executive Director may convene an emergency meeting whenever circumstances require immediate constitutional or administrative action.

</p>

<h3>Quorum</h3>

<p>

No constitutional decision shall be valid unless at least one-half of the eligible leadership members are present unless otherwise provided by this Constitution.

</p>

</div>

<!-- ARTICLE XIX -->

<div class="article">

<h2>ARTICLE XIX</h2>

<h3>Elections</h3>

<ul>

<li>All elections shall be conducted fairly and transparently.</li>

<li>Every eligible voter shall possess one vote.</li>

<li>Voting may be conducted physically or electronically.</li>

<li>Election procedures shall be announced before voting begins.</li>

<li>The Constitutional Council shall supervise election integrity.</li>

</ul>

</div>

<!-- ARTICLE XX -->

<div class="article">

<h2>ARTICLE XX</h2>

<h3>Code of Conduct</h3>

<p>

Every member shall uphold the dignity of the Antique Janta Party by following these principles.

</p>

<ul>

<li>Respect every individual.</li>

<li>No discrimination of any kind.</li>

<li>No hate speech or harassment.</li>

<li>No deliberate misinformation.</li>

<li>Encourage evidence-based discussion.</li>

<li>Criticise ideas, not individuals.</li>

<li>Respect differing political opinions.</li>

<li>Protect confidential Party information.</li>

<li>Maintain professionalism on every official platform.</li>

<li>Promote constitutional values above partisan interests.</li>

</ul>

</div>

<!-- ARTICLE XXI -->

<div class="article">

<h2>ARTICLE XXI</h2>

<h3>Discipline</h3>

<p>

Discipline is fundamental to maintaining the credibility and effectiveness of the Antique Janta Party.

</p>

<ul>

<li>Verbal Warning</li>

<li>Written Warning</li>

<li>Temporary Suspension</li>

<li>Removal from Office</li>

<li>Termination of Membership</li>

</ul>

<p>

Every member shall ordinarily be given an opportunity to respond before disciplinary action is finalised, except in extraordinary circumstances involving immediate threats to the organisation.

</p>

</div>

<!-- ARTICLE XXII -->

<div class="article">

<h2>ARTICLE XXII</h2>

<h3>Finance</h3>

<ul>

<li>Currently,Not required</li>



</ul>

<p>

All financial records shall remain transparent, accurately documented and available for internal review whenever required.

</p>

</div>

<!-- ARTICLE XXIII -->

<div class="article">

<h2>ARTICLE XXIII</h2>

<h3>Constitutional Amendments</h3>

<p>

This Constitution may be amended whenever necessary through the approval of not less than a two-thirds majority of the Constitutional Council.

</p>

<p>

Every amendment shall become effective immediately upon its official adoption unless otherwise specified.

</p>

</div>

<!-- ARTICLE XXIV -->

<div class="article">

<h2>ARTICLE XXIV</h2>

<h3>Dissolution</h3>

<p>

The Antique Janta Party may only be dissolved by an extraordinary resolution supported unanimously by the Constitutional Council together with not less than three-fourths of eligible voting members.

</p>

</div>

<!-- ARTICLE XXV -->

<div class="article">

<h2>ARTICLE XXV</h2>

<h3>Supremacy of the Constitution</h3>

<p>

This Constitution shall remain the supreme governing document of the Antique Janta Party.

</p>

<p>

Every rule, policy, directive and organisational decision shall remain consistent with its provisions.

</p>

</div>

</div>

background:linear-gradient(135deg,var(--gold),var(--gold-dark));

color:#fff;

font-weight:700;

text-decoration:none;

transition:.35s;

box-shadow:0 15px 35px rgba(212,175,55,.25);

}

.home-btn:hover{

transform:translateY(-6px);

box-shadow:0 20px 45px rgba(212,175,55,.35);

}

/*==========================
FOOTER
==========================*/

footer{

margin-top:80px;

background:linear-gradient(135deg,#c79a1d,#b8860b);

color:white;

padding:70px 20px;

text-align:center;

}

.footer-container{

max-width:1000px;

margin:auto;

}

footer h2{

font-size:2rem;

margin-bottom:10px;

}

footer p{

opacity:.95;

margin-top:10px;

}

/*==========================
BACK TO TOP
==========================*/

#topBtn{

position:fixed;

right:30px;

bottom:30px;

width:55px;

height:55px;

border:none;

border-radius:50%;

cursor:pointer;

font-size:22px;

background:linear-gradient(135deg,var(--gold),var(--gold-dark));

color:white;

display:none;

box-shadow:0 12px 30px rgba(212,175,55,.35);

transition:.35s;

z-index:9999;

}

#topBtn:hover{

transform:translateY(-6px) scale(1.08);

}

</style>

<script>

/*==========================
SCROLL PROGRESS
==========================*/

const progress=document.getElementById("progress");

window.addEventListener("scroll",()=>{

const winScroll=document.documentElement.scrollTop;

const height=document.documentElement.scrollHeight-document.documentElement.clientHeight;

progress.style.width=(winScroll/height)*100+"%";

});

/*==========================
REVEAL
==========================*/

const reveals=document.querySelectorAll(".reveal");

function reveal(){

reveals.forEach(el=>{

const top=el.getBoundingClientRect().top;

if(top<window.innerHeight-120){

el.classList.add("active");

}

});

}

window.addEventListener("scroll",reveal);

reveal();

/*==========================
BACK TO TOP
==========================*/

const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",()=>{

if(window.scrollY>500){

topBtn.style.display="block";

}else{

topBtn.style.display="none";

}

});

topBtn.onclick=()=>{

window.scrollTo({

top:0,

behavior:"smooth"

});

};

/*==========================
GOLD PARTICLES
==========================*/

const canvas=document.getElementById("particles");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;

canvas.height=document.documentElement.scrollHeight;

}

resize();

window.addEventListener("resize",resize);

const particles=[];

for(let i=0;i<90;i++){

particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2+1,

dx:(Math.random()-.5)*0.25,

dy:(Math.random()-.5)*0.25

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="rgba(212,175,55,.65)";

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.x+=p.dx;

p.y+=p.dy;

if(p.x<0)p.x=canvas.width;

if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;

if(p.y>canvas.height)p.y=0;

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>

</html>
